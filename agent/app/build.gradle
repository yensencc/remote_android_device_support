// Modified for remote_android_device_support (see agent/README-LTS.md): own package id, WebRTC from Maven Central, ARM only, external release signing.

apply plugin: 'com.android.application'
//apply plugin: 'com.google.gms.google-services'
//apply plugin: 'com.google.firebase.crashlytics'

android {
    compileSdkVersion 33
    namespace 'com.hmdm.control'

    buildFeatures {
        buildConfig = true
        aidl true
    }

    defaultConfig {
        // Our own package id, so this build never collides with (or updates) the official app
        applicationId "com.lasttechsol.remotesupport"
        minSdkVersion 24
        targetSdkVersion 33
        versionCode 2022
        versionName "2.02-lts2"

        // All supported devices are ARM; this drops the x86 WebRTC libraries.
        ndk { abiFilters "armeabi-v7a", "arm64-v8a" }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Default server URL (including last "/", for example: https://srv.apuppet.org/web-admin/ )
        // Leave empty if you do not need to preconfigure any server URL
        buildConfigField("String", "DEFAULT_SERVER_URL", "\"\"")
        // Default server secret (leave empty if no secret should be preconfigured;
        // secret is required to connect to the server)
        buildConfigField("String", "DEFAULT_SECRET", "\"\"")

        // Build variant displayed on the "About" screen
        buildConfigField("String", "VARIANT", "\"opensource + MDM integration\"")

        // Prefer Google (software) AVC encoder if available
        buildConfigField("Boolean", "USE_GOOGLE_ENCODER", "false")

        // Lock orientation during screen sharing
        buildConfigField("Boolean", "LOCK_ORIENTATION", "true")
    }

    // Release signing comes from a properties file OUTSIDE the repo
    // (default ~/.config/remote-support/agent-signing.properties; override with
    // AGENT_SIGNING_PROPERTIES). Keys: storeFile, storePassword, keyAlias, keyPassword.
    def signingFile = file(System.getenv("AGENT_SIGNING_PROPERTIES") ?:
            "${System.getProperty('user.home')}/.config/remote-support/agent-signing.properties")
    if (signingFile.exists()) {
        def props = new Properties()
        signingFile.withInputStream { props.load(it) }
        signingConfigs {
            release {
                storeFile file(props.storeFile)
                storePassword props.storePassword
                keyAlias props.keyAlias
                keyPassword props.keyPassword
            }
        }
    }

    buildTypes {
        release {
            if (signingFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.google.android.material:material:1.2.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-jackson:2.9.0'
    // HttpLoggingInterceptor may be considered as a vulnerability, so get rid of it!
//    implementation 'com.squareup.okhttp3:logging-interceptor:3.8.0'

    // Jackson
    implementation 'com.fasterxml.jackson.core:jackson-core:2.15.2'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.15.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'

//    implementation 'com.google.firebase:firebase-crashlytics:17.2.1'

    // WebRTC
    // google-webrtc 1.0.32006 is no longer published anywhere; this is the maintained
    // build of the same org.webrtc API (only the DataChannel is used).
    implementation 'io.github.webrtc-sdk:android:125.6422.07'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
}
